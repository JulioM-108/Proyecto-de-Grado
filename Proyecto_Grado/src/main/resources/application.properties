spring.application.name=Proyecto_Grado
server.port=${SERVER_PORT:8080}

# ==============================================================================
# PERSISTENCIA: SUPABASE (POSTGRESQL)
# Las credenciales se leen automáticamente del archivo .env
# ==============================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA (none: no modifica ni crea tablas en Supabase)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Evita que Hibernate escanee el information_schema de Supabase (evita colgarse en startup)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Las fechas (timestamptz) se leen en la zona horaria de la aplicación (APP_ZONA_HORARIA, por defecto America/Bogota)
# y no en UTC; así todas las vistas muestran la hora local.
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

# HikariCP optimizado para Supabase (conexión remota)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=13
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================================================================
# MOTOR DE IA: GOOGLE GEMINI
# Leído automáticamente del archivo .env
# ==============================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash}
gemini.model.auxiliary=${GEMINI_MODEL_AUXILIARY:gemini-3.1-flash-lite}

# ==============================================================================
# THYMELEAF (SSR)
# ==============================================================================
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}
spring.thymeleaf.encoding=UTF-8
