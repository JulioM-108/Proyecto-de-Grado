spring.application.name=Proyecto_Grado
server.port=${SERVER_PORT:8080}

# ==============================================================================
# PERSISTENCIA: SUPABASE (POSTGRESQL)
# Las credenciales se leen automáticamente del archivo .env
# ==============================================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-0-us-west-2.pooler.supabase.com:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.wtkubtblkyxqhlgzihob}
spring.datasource.password=${DB_PASSWORD:Hermanosj2003@-}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración Hibernate / JPA (none: no modifica ni crea tablas en Supabase)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# Evita que Hibernate escanee el information_schema de Supabase (evita colgarse en startup)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# HikariCP optimizado para Supabase (conexión remota)
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-test-query=SELECT 1

# ==============================================================================
# MOTOR DE IA: GOOGLE GEMINI
# Leído automáticamente del archivo .env
# ==============================================================================
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3-flash}

# ==============================================================================
# THYMELEAF (SSR)
# ==============================================================================
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
