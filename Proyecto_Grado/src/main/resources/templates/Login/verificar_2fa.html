<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación en Dos Pasos (2FA) — Javeriana Cali</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --puj-blue: #2c5697;
            --puj-blue-dark: #1b345c;
            --puj-black: #111111;
            --bg-page: #FFFFFF;
            --text-muted: #5a6272;
            --border-subtle: #D8DDE6;
        }
        * {
            box-sizing: border-box;
        }
        body {
            background-color: var(--bg-page);
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            color: var(--puj-black);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            letter-spacing: -0.01em;
        }
        .twofa-wrapper {
            max-width: 440px;
            width: 100%;
        }
        .auth-card {
            background: #FFFFFF;
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            padding: 36px 32px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.02), 0 12px 24px -4px rgba(27, 52, 92, 0.04);
        }
        .shield-icon-circle {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            background: #E8EFF8;
            color: var(--puj-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 16px auto;
        }
        .code-input {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 2.2rem;
            letter-spacing: 12px;
            text-align: center;
            font-weight: 700;
            color: var(--puj-blue);
            border: 1px solid #BFC7D1;
            border-radius: 12px;
            padding: 12px;
            background: #FFFFFF;
            transition: all 0.15s ease;
        }
        .code-input:focus {
            background: #FFFFFF;
            border-color: var(--puj-blue);
            box-shadow: 0 0 0 3px rgba(44, 86, 151, 0.12);
        }
        .btn-auth {
            background-color: var(--puj-blue);
            color: #FFFFFF;
            font-weight: 600;
            font-size: 0.92rem;
            padding: 12px 16px;
            border-radius: 10px;
            border: none;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-auth:hover {
            background-color: var(--puj-blue-dark);
            color: #FFFFFF;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

<div class="twofa-wrapper">

    <div class="auth-card text-center">

        <div class="shield-icon-circle">
            <i class="bi bi-shield-check"></i>
        </div>

        <h4 class="fw-bold mb-1" style="color: var(--puj-blue);">Verificación en Dos Pasos</h4>
        <p class="text-muted small mb-4">Introduce el código temporal generado en tu aplicación autenticadora (Google Authenticator)</p>

        <!-- Mensajes de Error -->
        <div th:if="${error}" class="alert alert-danger py-2 px-3 small rounded-3 mb-3 text-start" role="alert">
            <i class="bi bi-exclamation-circle-fill me-1"></i>
            <span th:text="${error}">Código de verificación inválido.</span>
        </div>

        <div class="bg-light p-2 rounded-3 small text-muted mb-4">
            Docente: <strong class="text-dark" th:text="${correo}">profesor@javerianacali.edu.co</strong>
        </div>

        <form th:action="@{/login/2fa}" method="post">
            <div class="mb-4">
                <input type="text" 
                       class="form-control code-input" 
                       id="codigo" 
                       name="codigo" 
                       placeholder="000000" 
                       maxlength="6" 
                       pattern="[0-9]{6}" 
                       inputmode="numeric" 
                       autocomplete="one-time-code"
                       required 
                       autofocus>
                <div class="form-text small text-muted mt-2">
                    <i class="bi bi-clock-history me-1"></i>El código de 6 dígitos se renueva cada 30 segundos
                </div>
            </div>

            <button type="submit" class="btn-auth w-100 mb-3">
                <i class="bi bi-key-fill"></i>
                <span>Verificar y Continuar</span>
            </button>

            <div>
                <a th:href="@{/login}" class="text-muted small text-decoration-none d-inline-flex align-items-center gap-1">
                    <i class="bi bi-arrow-left"></i>
                    <span>Volver al inicio de sesión</span>
                </a>
            </div>
        </form>

    </div>

</div>

</body>
</html>
